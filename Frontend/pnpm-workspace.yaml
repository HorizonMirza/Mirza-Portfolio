onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - sharp
  - unrs-resolver

# Paksa versi aman untuk dependency milik Prisma CLI yang punya celah keamanan
# (mysql2: GHSA-rgwj-5xj2-c3m3 dan lainnya, deepmerge-ts: stack exhaustion), dan source-map-js dari
# Tailwind/PostCSS (GHSA-68fv-2mgg-jv7q, DoS pada source map; aman di >=1.2.2), dan vite dari
# @vitejs/plugin-react/Vitest (GHSA-587h-7wmj-h5pm lewat launch-editor, hanya di Windows; aman di >=8.3.3).
# Hapus bila dependency induknya sudah memakai versi aman sendiri.
overrides:
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0
  source-map-js: ^1.2.2
  vite: ^8.3.3
  # minimatch lewat eslint dan @eslint/config-array (GHSA-g3hv-75wg-m249, DoS pola glob; aman di
  # >=11.0.1). Dikunci 11.0.4 dan dependensi barunya 1.0.3: versi terbaru (11.0.5, 1.1.0) belum
  # berumur 7 hari (WORKFLOW.md 10a). API yang dipakai ESLint (Minimatch, match, pattern) tetap ada
  # di 11. Hapus bila eslint sudah memakai minimatch 11 sendiri.
  'minimatch@>=10 <11.0.1': 11.0.4
  '@isaacs/nonrecursive-glob-match': 1.0.3

# Advisory tanpa versi perbaikan (patched: <0.0.0) yang hanya ada di alat pengembangan:
# braces lewat eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch
# (GHSA-vfj7-8cjw-p6xm, DoS pola glob bersarang). Hanya dipakai ESLint dengan pola dari config
# repo sendiri, tidak ikut ke production dan tidak menerima input pengguna. Hapus bila sudah ada
# versi aman (cek: pnpm audit).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
